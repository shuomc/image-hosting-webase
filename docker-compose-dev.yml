services:
  # -------------------------------------------
  # 1. PostgreSQL 数据库 (支持两个数据库)
  # -------------------------------------------
  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      # 自定义变量：用于创建两个数据库 (image_hosting 和 maven_demo)
      - POSTGRES_MULTIPLE_DATABASES=image_hosting,maven_demo
    volumes:
      - postgres-data:/var/lib/postgresql
      # 挂载初始化脚本，用于创建多个数据库
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      # 映射到本地的 15432 端口，避免与本地其他 Postgres 冲突
      - "15432:5432"
    networks:
      - infra-network # 使用一个专门的基础设施网络

  # -------------------------------------------
  # 2. Redis 缓存
  # -------------------------------------------
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379" # 映射端口供本地应用连接
    networks:
      - infra-network

  # -------------------------------------------
  # 3. MinIO 对象存储
  # -------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: minio
    restart: always
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      # 映射 API 端口
      - "19000:9000"
      # 映射控制台端口
      - "19090:9090"
    command: server /data --console-address ":9090"
    networks:
      - infra-network

networks:
  infra-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data: