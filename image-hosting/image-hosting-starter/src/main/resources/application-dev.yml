spring:
  datasource:
    url: jdbc:postgresql://your-database-host:5432/image_hosting
    username: your-database-username
    password: your-database-password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
      database: 3
  mail:
    host: # Your POP3/SMTP HOST
    port: # Your POP3/SMTP PORT
    username: # Your POP3/SMTP USERNAME
    password: # Your POP3/SMTP PASSWORD/AUTHORZATION CODE
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true